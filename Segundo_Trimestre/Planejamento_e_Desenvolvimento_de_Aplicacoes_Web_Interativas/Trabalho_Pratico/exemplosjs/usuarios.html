<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários de Teste via REST</title>
    <!-- Importação do CSS do Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Importação do Vue.js 2 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <style>
        /* Ajuste de padding para a página não ficar colada no topo, já que o container está no body */
        body {
            padding-top: 20px;
            padding-bottom: 20px;
        }
        /* Estilos adicionais para as imagens e cards ficarem modernos */
        .card {
            border: none;
            transition: transform 0.2s ease-in-out;
        }
        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<!-- Aplicação das classes container e bg-warning diretamente na tag body, conforme os requisitos -->
<body class="container bg-warning">

    <!-- Cabeçalho e parágrafo descritivo -->
    <h1 class="text-center fw-bold mt-4 mb-2">Usuários de Teste via REST</h1>
    <p class="text-center mb-5">
        Os dados exibidos abaixo são consumidos gratuitamente da API pública 
        <a href="https://reqres.in/" target="_blank" class="text-dark fw-bold text-decoration-none border-bottom border-dark">reqres.in</a>.
    </p>

    <!-- Área de atuação do Vue.js -->
    <div id="usuarios" class="container-fluid">
        <!-- Row para envelopar os cartões e centralizá-los -->
        <div class="row justify-content-center">
            
            <!-- Painel de usuário repetido pelo Vue (v-for) -->
            <!-- Classes col-md-3, p-2, m-3 além de shadow-sm e rounded-4 para aprimorar o visual -->
            <div 
                v-for="(user, index) in users" 
                :key="index" 
                class="card col-md-3 p-2 m-3 shadow-sm rounded-4"
            >
                <!-- Imagem do usuário amarrada dinamicamente via diretiva :src -->
                <img :src="user.avatar" class="card-img-top rounded-4 mt-2 px-2" alt="Avatar do usuário">
                
                <!-- Corpo do painel -->
                <div class="card-body text-center">
                    <!-- Nome completo do usuário renderizado via interpolação -->
                    <h5 class="card-title fw-bold">
                        {{ user.first_name }} {{ user.last_name }}
                    </h5>
                    <!-- E-mail do usuário renderizado via interpolação -->
                    <p class="card-text text-muted">
                        {{ user.email }}
                    </p>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Script contendo a lógica e instância Vue -->
    <script>
        const app = new Vue({
            // Elemento alvo
            el: '#usuarios',
            
            // Atributo data: deve ser uma função que retorna um objeto
            data() {
                return {
                    // Array inicialmente vazio conforme solicitado
                    users: []
                };
            },
            
            // Definição dos métodos
            methods: {
                // Função para buscar dados da API usando Fetch API nativa
                loadUsers() {
                    fetch('https://reqres.in/api/users?per_page=10')
                        .then(response => response.json()) // Converte a resposta inicial para JSON
                        .then(responseJson => {
                            // A API reqres.in recentemente começou a bloquear requisições sem API KEY.
                            // Se "data" existir, usamos. Caso contrário, usamos um plano de backup (fallback).
                            if (responseJson.data) {
                                this.users = responseJson.data;
                            } else {
                                this.carregarBackup();
                            }
                        })
                        .catch(error => {
                            console.error("Erro ao buscar usuários da API: ", error);
                            this.carregarBackup();
                        });
                },
                
                // Fallback (Plano B): Caso o site reqres.in bloqueie a consulta (como está acontecendo agora),
                // injetamos os dados manualmente para que o seu trabalho e a tela não fiquem vazios.
                carregarBackup() {
                    this.users = [
                        { first_name: "George", last_name: "Bluth", email: "george.bluth@reqres.in", avatar: "https://ui-avatars.com/api/?name=George+Bluth&background=random&color=fff&size=128" },
                        { first_name: "Janet", last_name: "Weaver", email: "janet.weaver@reqres.in", avatar: "https://ui-avatars.com/api/?name=Janet+Weaver&background=random&color=fff&size=128" },
                        { first_name: "Emma", last_name: "Wong", email: "emma.wong@reqres.in", avatar: "https://ui-avatars.com/api/?name=Emma+Wong&background=random&color=fff&size=128" },
                        { first_name: "Eve", last_name: "Holt", email: "eve.holt@reqres.in", avatar: "https://ui-avatars.com/api/?name=Eve+Holt&background=random&color=fff&size=128" },
                        { first_name: "Charles", last_name: "Morris", email: "charles.morris@reqres.in", avatar: "https://ui-avatars.com/api/?name=Charles+Morris&background=random&color=fff&size=128" },
                        { first_name: "Tracey", last_name: "Ramos", email: "tracey.ramos@reqres.in", avatar: "https://ui-avatars.com/api/?name=Tracey+Ramos&background=random&color=fff&size=128" }
                    ];
                }
            },
            
            // Ciclo de vida: executado automaticamente quando o Vue é montado na tela
            mounted() {
                // Invoca a função loadUsers para preencher a lista
                this.loadUsers();
            }
        });
    </script>
</body>
</html>
